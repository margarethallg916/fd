services:
  redis:
    image: redis:alpine
    container_name: kunxiaozhi-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mongodb:
    image: mongo:8.2.5
    container_name: kunxiaozhi-mongodb
    restart: always
    command: mongod --wiredTigerCacheSizeGB 0.5
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: kunxiaozhi-qdrant
    restart: always
    volumes:
      - qdrant-data:/qdrant/storage

  kunxiaozhi:
    container_name: kunxiaozhi
    image: ghcr.io/123zhaozheng/kunxiaozhi:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017
      - QDRANT_URL=http://qdrant:6333
      - LLM_MODEL_CACHE_SIZE=${LLM_MODEL_CACHE_SIZE:-50}
      - SESSION_MAX_EVENTS_PER_TRACE=${SESSION_MAX_EVENTS_PER_TRACE:-10000}
      - LOG_LEVEL=INFO
      - ENABLE_MESSAGE_HISTORY=true
      - EVENT_MERGE_INTERVAL=60
    volumes:
      - lamb-data:/app/data
      - ./workspace:/app/workspace
      - ./uploads:/app/uploads

volumes:
  redis-data:
  mongodb-data:
  qdrant-data:
  lamb-data:
